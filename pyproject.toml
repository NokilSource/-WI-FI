[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "system-repair"
version = "0.1.0"
description = "Local Windows policy and network repair with mandatory backups"
requires-python = ">=3.12,<3.15"
dependencies = ["PySide6==6.11.2", "psutil==7.2.2"]

[project.gui-scripts]
system-repair = "system_repair.__main__:main"

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-qt==4.5.0", "ruff==0.16.9"]
build = ["pyinstaller==6.22.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
